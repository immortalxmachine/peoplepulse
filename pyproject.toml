[project]
name = "peoplepulse"
version = "0.1.0"
description = "People-analytics MIS + guard-railed GenAI HR query assistant (synthetic HRIS data)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data_out"]

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = isort, UP = pyupgrade, B = bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the repo root on sys.path so `peoplepulse` and `eval` import whether
# pytest is run as `pytest` (CI) or `python -m pytest` (local).
pythonpath = ["."]
